name: 公開情報一覧の更新

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'config/tools.json'
      - 'dev/scripts/update-release-index.ps1'
      - '.github/workflows/release-index.yml'

permissions:
  contents: write

concurrency:
  group: release-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 公開情報を取得
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./dev/scripts/update-release-index.ps1 -OutputPath "$env:RUNNER_TEMP/release-index.json"
      - name: 一覧専用ブランチへ保存
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git ls-remote --exit-code --heads origin refs/heads/release-index | Out-Null
          if ($LASTEXITCODE -eq 0) {
            git fetch origin refs/heads/release-index:refs/remotes/origin/release-index
            if ($LASTEXITCODE -ne 0) { throw '一覧ブランチを取得できません。' }
            git switch -C release-index origin/release-index
          } elseif ($LASTEXITCODE -eq 2) {
            git switch -c release-index
          } else { throw '一覧ブランチを確認できません。' }
          if ($LASTEXITCODE -ne 0) { throw '一覧ブランチへ切り替えられません。' }
          New-Item -ItemType Directory -Force config | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/release-index.json" -Destination 'config/release-index.json' -Force
          git add config/release-index.json
          if ($LASTEXITCODE -ne 0) { throw '一覧を記録できません。' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m '公開情報一覧を更新'
            if ($LASTEXITCODE -ne 0) { throw '一覧をコミットできません。' }
            git push origin HEAD:refs/heads/release-index
            if ($LASTEXITCODE -ne 0) { throw '一覧を公開できません。' }
          } elseif ($LASTEXITCODE -ne 0) { throw '一覧の差分を確認できません。' }
